<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>いしころの 小さなたび</title>
<style>
:root{color-scheme:light;--ink:#263f36;--paper:#f7f1df;--leaf:#376b50;--gold:#d4a64d}*{box-sizing:border-box}body{margin:0;background:#dfe5cf;color:var(--ink);font:600 16px/1.6 'Hiragino Maru Gothic ProN',system-ui,sans-serif}button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:3px solid #ad572e;outline-offset:3px}[hidden]{display:none!important}.shell{max-width:1120px;margin:auto;padding:12px max(12px,env(safe-area-inset-right)) 16px max(12px,env(safe-area-inset-left))}header{display:flex;align-items:center;justify-content:space-between;gap:10px}header p{margin:0;font-size:12px;letter-spacing:.1em}h1{font-size:clamp(20px,3vw,32px);margin:0;font-weight:800}.small{font-size:12px}.pill{min-height:44px;border:1px solid #8b9e81;border-radius:24px;background:var(--paper);padding:6px 14px}.progress{display:flex;gap:6px;align-items:center}.dot{width:22px;height:8px;background:#bec9ad;border-radius:4px}.dot.done{background:var(--leaf)}.dot.now{background:var(--gold)}.game{margin-top:10px;border:1px solid #a1b28d;background:var(--paper);border-radius:18px;overflow:hidden;box-shadow:0 8px 30px #304c3320}.heading{padding:12px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px}.heading h2{font-size:20px;margin:0}.heading p{margin:0;font-size:13px}.map{position:relative;height:clamp(220px,40vh,370px);overflow:hidden;background:#c9dcc6}.map svg.land{width:100%;height:100%;position:absolute;inset:0}.site{position:absolute;transform:translate(-50%,-50%);min-height:56px;min-width:120px;padding:8px 14px;border:2px solid #f5edd3;border-radius:14px;background:#294f40ed;color:#fff6dc;box-shadow:0 4px 0 #17362d55;font-size:14px;line-height:1.5}.site b{display:block;font-size:12px;font-weight:500;color:#dddcb5}.site:disabled{opacity:.5;cursor:default}.site.finished{opacity:1;background:#e9d593;color:#253f34}.site.finished b{color:#4b6044}.hero{position:absolute;left:12%;top:64%;width:64px;height:58px;transform:translate(-50%,-50%);transition:left .55s ease,top .55s ease;pointer-events:none;filter:drop-shadow(0 4px 2px #264c3030)}.hero svg{width:100%;height:100%}.hero.bump{animation:bump .3s 2}.hero.spark{animation:shine .6s}.caption{position:absolute;left:12px;bottom:7px;font-size:11px;color:#314e3f;background:#f5efd6db;border-radius:12px;padding:2px 10px}.message{padding:10px 18px;min-height:74px;border-bottom:1px dashed #c5c9ab;display:flex;gap:12px;align-items:center}.message .mark{font-size:24px;flex:none}.message p{margin:0;font-size:14px}.message strong{display:block;font-size:16px}.controls{padding:12px 18px;display:flex;gap:12px;align-items:stretch}.stones{display:flex;gap:8px;flex:1;min-width:0}.stone{position:relative;flex:1;min-width:0;min-height:92px;background:#e9e5d3;border:2px solid transparent;border-radius:12px;padding:6px 4px;display:grid;justify-items:center;gap:1px;line-height:1.4}.stone[aria-pressed=true]{border-color:var(--leaf);background:#fffdf1;box-shadow:inset 0 -4px #a7bd86}.stone svg{width:64px;height:38px}.stone span{font-size:12px}.stone b{font-size:14px}.stone .selected{font-size:10px;color:#376b50;min-height:14px}.actions{display:grid;align-content:center;gap:6px;width:160px;flex:none}.evolve{border:1px solid #95859f;background:#e9dfef;border-radius:12px;min-height:56px;font-size:14px;padding:6px}.evolve small{display:block;font-size:11px}.primary{background:var(--leaf);color:#fff6dc;border:0;border-radius:12px;min-height:48px;padding:8px 20px;font-weight:800}.bottom{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:0 18px 12px}.bottom p{font-size:12px;margin:0}.notes{padding-top:10px;display:flex;flex-wrap:wrap;gap:6px}.note{background:#f8f2df;border:1px solid #b5bea1;padding:4px 10px;border-radius:8px;font-size:12px}.modal{position:fixed;inset:0;background:#173c33c9;display:grid;place-items:center;padding:16px;z-index:5}.card{background:var(--paper);border-radius:20px;padding:24px;max-width:580px;max-height:95dvh;overflow:auto;text-align:center}.card h2{font-size:27px;margin:6px}.card p{font-size:15px}.routes{display:grid;gap:8px;text-align:left;margin:16px 0}.routes>div{padding:8px 12px;border-bottom:1px dashed #b6c09f}.card .row{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}footer{font-size:11px;margin-top:10px;color:#53674f}dialog{border:0;border-radius:16px;background:var(--paper);max-width:500px;color:var(--ink);padding:22px}dialog::backdrop{background:#173c33b0}@keyframes bump{50%{margin-left:-12px;rotate:-12deg}}@keyframes shine{50%{filter:drop-shadow(0 0 14px #e3bf52);scale:1.18}}@media(max-height:500px) and (min-width:600px){.shell{padding-top:4px}header p,footer{display:none}.game{margin-top:5px}.heading{padding:3px 14px}.heading h2{font-size:16px}.map{height:120px}.site{min-height:48px;font-size:12px;padding:3px 10px}.hero{width:48px;height:42px}.message{min-height:48px;padding:4px 14px}.message p{font-size:12px}.message strong{font-size:13px;display:inline;margin-right:8px}.controls{padding:5px 14px;gap:8px}.stone{min-height:64px;padding:2px}.stone svg{width:42px;height:24px}.stone .selected{display:none}.stone b{font-size:12px}.stone span{font-size:11px}.actions{width:230px;display:flex;align-items:center}.actions .evolve{flex:1}.actions .pill{font-size:12px;white-space:nowrap}.evolve{min-height:48px;font-size:12px}.bottom{padding:0 14px 5px}.notes{padding-top:4px}.note{font-size:11px;padding:1px 6px}}@media(max-width:550px){header p{font-size:10px}.heading{display:block;padding:8px 12px}.controls{padding:8px;flex-wrap:wrap}.actions{display:flex;width:100%;align-items:center}.evolve{flex:1}.actions .pill{font-size:12px}.message{padding:8px 12px}.site{min-width:104px;font-size:12px}.stone svg{width:56px}.bottom{padding:0 10px 10px;align-items:flex-start}.bottom p{max-width:55%}.primary{font-size:14px;padding:8px 12px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
<div class="shell">
<header><div><p>ちそうと ひょうほんの ぼうけんずかん</p><h1>いしころの 小さなたび</h1></div><div class="progress" aria-label="3つの ばしょ"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div><button class="pill" id="sound" aria-pressed="false">♪ おと なし</button></header>
<main class="game"><div class="heading"><h2 id="place"></h2><p id="goal"></p></div><div class="map" id="map"><svg class="land" viewBox="0 0 1000 360" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#bad7d2"/><stop offset="1" stop-color="#e8e8cb"/></linearGradient><pattern id="grain" width="37" height="27" patternUnits="userSpaceOnUse"><circle cx="8" cy="13" r="1" fill="#5f7a4a" opacity=".2"/></pattern></defs><rect width="1000" height="360" fill="url(#sky)"/><circle cx="825" cy="54" r="35" fill="#f6e8ad"/><path d="M0 190 160 90 310 175 480 65 710 160 880 80 1000 175V360H0" fill="#8cae9d"/><path d="M0 240 210 150 440 220 640 130 1000 210V360H0" fill="#628b71"/><path d="M0 260Q220 190 430 250T1000 215V360H0" fill="#b8be83"/><path d="M0 315Q300 250 540 310T1000 280V360H0" fill="#a68d61"/><path d="M0 345Q300 295 560 342T1000 315" fill="none" stroke="#d3b785" stroke-width="13"/><rect width="1000" height="360" fill="url(#grain)"/><path id="trail" d="M120 230Q230 210 340 130T820 200M120 230Q330 335 530 270T820 200" fill="none" stroke="#f2e1a9" stroke-width="20" stroke-linecap="round"/><path d="M120 230Q230 210 340 130T820 200M120 230Q330 335 530 270T820 200" fill="none" stroke="#92794e" stroke-width="2" stroke-dasharray="5 12"/><g id="nature"></g><g transform="translate(860 170)"><path d="m-20 50 0-58 46-18 0 76Z" fill="#f4e7ba" stroke="#4d6750" stroke-width="3"/><path d="m-25-8 28-20 28 15" fill="none" stroke="#4d6750" stroke-width="5"/><path d="M-8 20h24M-8 30h24" stroke="#a19468" stroke-width="3"/></g></svg><div class="hero" id="hero"></div><div id="sites"></div><span class="caption" id="caption">いしを えらんで → みちに おこう</span></div>
<div class="message" role="status" aria-live="polite"><span class="mark" id="mark">✧</span><p><strong id="messageTitle"></strong><span id="messageBody"></span></p></div>
<div class="controls"><div class="stones" id="stones" aria-label="つかう いし"></div><div class="actions"><button class="evolve" id="evolve">さがん → けいがん<small>ねつ ＋ あつりょくで へんしん</small></button><button class="pill" id="undo" disabled>ひとつ もどす</button></div></div>
<div class="bottom"><p id="instruction">いしを えらぶ → みちを おす</p><button class="primary" id="next" hidden>つぎの ばしょへ →</button><button class="pill" id="hint">はかせの ヒント</button></div></main>
<div class="notes" id="notes" aria-label="みつけた ひみつ"></div><footer>いしころ戦記から生まれた、3分の冒険の試作。セーブの読み書き・通信はしません。</footer></div>
<div class="modal" id="welcome"><section class="card" role="dialog" aria-modal="true" aria-labelledby="welcomeTitle"><p>ひょうほんばこを めざして</p><h2 id="welcomeTitle">小さな いしの<br>大きな ひみつ。</h2><p>いしを えらんで、みちに おこう。<br>うまく いかなかったら、ためしなおそう。</p><p class="small">3つの ばしょ。じかんぎれは ないよ。</p><button class="primary" id="start">たんけんに でる →</button></section></div>
<div class="modal" id="ending" hidden><section class="card" role="dialog" aria-modal="true" aria-labelledby="endTitle"><p>たどりついた！</p><h2 id="endTitle">きみだけの たんけんきろく</h2><div class="routes" id="routes"></div><p id="endingText"></p><div class="row"><button class="primary" id="restart">べつの みちで もういちど</button><button class="pill" id="lookBack">たんけんを みなおす</button></div></section></div>
<dialog id="explanation"><p id="explainText"></p><button class="primary" id="closeExplanation">わかった</button></dialog>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);
const rocks={sandstone:{name:'さがん',trait:'すなつぶの いし',fill:'#bc975f',stroke:'#7c6746',shape:'M8 26 16 9 40 4 56 17 52 34 22 39Z'},pumice:{name:'かるいし',trait:'あなが おおい',fill:'#dad9bd',stroke:'#92977c',shape:'M7 24Q7 6 26 5Q51 0 57 20Q62 39 35 39Q14 42 7 24'},obsidian:{name:'こくようせき',trait:'われた ふちが するどい',fill:'#42484e',stroke:'#202f35',shape:'M10 33 24 4 45 8 57 31 34 39Z'},quartzite:{name:'けいがん',trait:'かたく しまった',fill:'#d7b5b9',stroke:'#917a83',shape:'M6 26 16 8 34 3 55 14 57 29 37 39 16 36Z'}};
function specimen(id){const k=rocks[id];let detail=id==='pumice'?'<g fill="#9ba38a"><ellipse cx="20" cy="18" rx="4" ry="3"/><ellipse cx="40" cy="13" rx="3" ry="2"/><ellipse cx="36" cy="29" rx="5" ry="3"/><circle cx="49" cy="23" r="2"/></g>':id==='obsidian'?'<path d="m24 5 5 24 15-19M29 29l23 1" fill="none" stroke="#a4b5b3" stroke-width="1.5"/>':id==='sandstone'?'<path d="m12 19 40 2M12 28l39 2" stroke="#e5c88c" stroke-width="2"/>':'<path d="m14 23 12-9 13 16 12-9" stroke="#f5e3d5" stroke-width="3" fill="none"/>';
return `<svg viewBox="0 0 64 44" aria-hidden="true"><path d="${k.shape}" fill="${k.fill}" stroke="${k.stroke}" stroke-width="2"/>${detail}<path d="M26 26h2m11-1h2" stroke="#253c35" stroke-width="3" stroke-linecap="round"/><path d="M30 31q4 4 8-1" fill="none" stroke="#435046" stroke-width="1.5"/></svg>`;}
const scenes=[{name:'01 ねっこの こみち',goal:'むこうの ひょうほんばこへ すすもう',intro:'ねっこが からまっている。',body:'どの いしで、どの みちを いこう？',sites:[{id:'roots',x:40,y:39,label:'ねっこを きる',sub:'みじかい みち',kind:'root'},{id:'around',x:57,y:77,label:'おかを まわる',sub:'とおまわり',kind:'safe'}]},
{name:'02 すなの おか',goal:'すなを はこぶ かぜが ふいている',intro:'すなあらしだ。どう すすもう？',body:'かぜに そなえる？ かげを さがす？',sites:[{id:'wind',x:45,y:35,label:'すなあらしを こえる',sub:'ふきさらしの みち',kind:'wind'},{id:'shelter',x:58,y:77,label:'がけの かげへ',sub:'かぜを よける',kind:'safe'}]},
{name:'03 ひょうほんの たに',goal:'ふたつの しかけの さきに、たからもの',intro:'さいごは ふたつの しかけ。',body:'ねっこの さきには すなあらし。べつの みちも あるよ。',sites:[{id:'finalRoots',x:36,y:37,label:'ねっこを きる',sub:'ちかみち ①',kind:'root'},{id:'finalWind',x:64,y:32,label:'すなを こえる',sub:'ちかみち ②',kind:'wind',locked:true},{id:'valley',x:52,y:78,label:'たにを まわる',sub:'よりみちの はっけん',kind:'safe'}]}];
let state,history=[],audio=null,enabled=false,busy=false,returnFocus=null;
function reset(){state={scene:0,selected:'sandstone',evolved:false,cleared:[],records:[],notes:[],rootOpen:false};history=[];busy=false;$('ending').hidden=true;document.querySelector('.shell').inert=false;render();message(scenes[0].intro,scenes[0].body);}
function sound(ok){if(!enabled)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.connect(g);g.connect(audio.destination);o.type='sine';o.frequency.setValueAtTime(ok?523:220,audio.currentTime);o.frequency.exponentialRampToValueAtTime(ok?784:165,audio.currentTime+.18);g.gain.setValueAtTime(.07,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.3);o.start();o.stop(audio.currentTime+.32);}catch(_){}}
function message(title,body,mark='✧'){$('messageTitle').textContent=title;$('messageBody').textContent=body;$('mark').textContent=mark;}
function remember(){history.push(JSON.stringify(state));}
function note(key,text){if(!state.notes.some(n=>n.key===key))state.notes.push({key,text});}
function render(){const s=scenes[state.scene];$('place').textContent=s.name;$('goal').textContent=s.goal;document.querySelectorAll('.dot').forEach((d,i)=>{d.className='dot '+(i<state.scene||state.cleared.includes(i)?'done':i===state.scene?'now':'');});
$('stones').innerHTML=['sandstone','pumice','obsidian'].map(base=>{const id=base==='sandstone'&&state.evolved?'quartzite':base;return `<button class="stone" data-rock="${id}" aria-pressed="${state.selected===id}" aria-label="${rocks[id].name}：${rocks[id].trait}">${specimen(id)}<b>${rocks[id].name}</b><span>${rocks[id].trait}</span><span class="selected">${state.selected===id?'えらんでいる':'えらぶ'}</span></button>`;}).join('');
$('hero').innerHTML=specimen(state.selected);$('sites').innerHTML=s.sites.map(site=>`<button class="site${(state.records.find(r=>r.scene===state.scene)||{}).site===site.id||(state.rootOpen&&site.kind==='root')?' finished':''}" data-site="${site.id}" style="left:${site.x}%;top:${site.y}%" ${state.cleared.includes(state.scene)||(site.locked&&!state.rootOpen)||(state.scene===2&&state.rootOpen&&site.kind==='root')?'disabled':''}>${site.label}<b>${site.locked&&!state.rootOpen?'ねっこの さき':site.sub}</b></button>`).join('');
const cut=state.rootOpen||state.records.some(r=>r.scene===state.scene&&r.site==='roots');
$('nature').innerHTML=state.scene===0?(cut?'<path d="M310 80l25 20M420 157l30 23M390 65l-7 22M408 161l27 24" fill="none" stroke="#574b35" stroke-width="9"/>':'<g stroke="#574b35" fill="none" stroke-width="9"><path d="M310 80q70 40 140 100M390 65q-40 85 45 120M340 128l-30 55"/></g>'):state.scene===1?'<g fill="none" stroke="#f5df9c" stroke-width="5"><path d="M250 60q160-50 350 20M350 110q170-40 350 0M280 150q150-20 260 15"/></g><path d="m500 310 80-120 80 130Z" fill="#7e856a"/>':`<path d="${cut?'M270 75l18 8M355 144l25 26':'M270 75q60 15 110 95'}" stroke="#66523b" stroke-width="10" fill="none"/><path d="M520 65q80-35 180 15M520 110q100-25 210 5" fill="none" stroke="#eed392" stroke-width="6"/><path d="m420 350 40-95 85 95" fill="#d2b997"/>`;
$('evolve').disabled=state.evolved||busy;$('evolve').innerHTML=state.evolved?'けいがんに なった！<small>かたく しまった いし</small>':'さがん → けいがん<small>ねつ ＋ あつりょくで へんしん</small>';$('undo').disabled=!history.length||busy;$('next').hidden=!state.cleared.includes(state.scene);$('next').textContent=state.scene===2?'ひょうほんばこを あける →':'つぎの ばしょへ →';$('hint').hidden=state.cleared.includes(state.scene);$('notes').innerHTML=state.notes.map(n=>`<span class="note">✧ ${n.text}</span>`).join('');$('instruction').textContent=state.cleared.includes(state.scene)?'みちが ひらいた！':state.scene===2&&state.rootOpen?'つぎは すなあらし。いしを えらびなおそう。':'いしを えらぶ → みちを おす';}
function animate(site,ok){$('hero').style.left=site.x+'%';$('hero').style.top=(site.y+13)+'%';$('hero').classList.remove('bump','spark');void $('hero').offsetWidth;$('hero').classList.add(ok?'spark':'bump');}
function place(id){if(busy||state.cleared.includes(state.scene))return;const site=scenes[state.scene].sites.find(x=>x.id===id);if(!site||(site.locked&&!state.rootOpen))return;const rock=state.selected;const ok=site.kind==='safe'||site.kind==='root'&&rock==='obsidian'||site.kind==='wind'&&rock==='quartzite';sound(ok);
if(!ok){animate(site,false);message(site.kind==='root'?'ねっこは まだ つながっている。':rock==='obsidian'?'するどくても、かたさは べつ。':'すなで けずられて しまう。',site.kind==='root'?'われた ふちが するどい いしを ためすか、べつの みちへ。':'かたい いしに へんしんする？ かげの みちも あるよ。','↺');return;}
remember();if(site.kind==='root')note('sharp','こくようせきの ふちは するどい');if(site.kind==='wind')note('hard','けいがんは すなに けずられにくい');if(site.kind==='safe')note(state.scene===2?'fossil':'shelter',state.scene===2?'よりみちで かせきの もようを はっけん':'みちを かえるのも ひとつの くふう');
if(state.scene===2&&site.kind==='root'){state.rootOpen=true;render();animate(site,true);message('ねっこが きれた！','この さきは すなあらし。つぎの いしを えらぼう。','✂');return;}
state.cleared.push(state.scene);state.records.push({scene:state.scene,site:site.id,route:site.kind==='safe'?'まわりみち':state.scene===2?'ねっこ → すなあらし':site.label,rock:rocks[rock].name});render();animate(site,true);message(site.kind==='safe'?'みちを みつけた！':site.kind==='root'?'するどい ふちで、ねっこが きれた！':'かたい けいがんで、すなあらしを こえた！',site.kind==='safe'?(state.scene===2?'よりみちで、かせきの もようも みつけたよ。':'いしを かえずに、みちを かえて すすめたね。'):'きみが えらんだ いしの とくちょうが やくに たった。','✧');}
$('stones').addEventListener('click',e=>{const b=e.target.closest('[data-rock]');if(!b||busy)return;state.selected=b.dataset.rock;render();$('hero').classList.remove('bump','spark');});$('sites').addEventListener('click',e=>{const b=e.target.closest('[data-site]');if(b)place(b.dataset.site);});
$('evolve').onclick=()=>{if(state.evolved||busy)return;remember();state.evolved=true;state.selected='quartzite';note('metamorphism','さがん → ねつ・あつりょく → けいがん');render();$('hero').classList.add('spark');sound(true);message('さがんが、けいがんに へんしん！','ほんとうは ちかで、ながい ときを かけて かわるよ。','◇');};
$('undo').onclick=()=>{if(!history.length||busy)return;state=JSON.parse(history.pop());$('hero').style.left='12%';$('hero').style.top='64%';render();message('ひとつ もどしたよ。','べつの いしや みちも ためして みよう。','↺');};
$('next').onclick=()=>{if(!state.cleared.includes(state.scene))return;if(state.scene===2){$('routes').innerHTML=state.records.map(r=>`<div><b>${scenes[r.scene].name}</b><br>${r.route} ／ ${r.rock}</div>`).join('');$('endingText').textContent=`${state.notes.length}この はっけんを もちかえった！ ほかの みちには なにが あるかな？`;$('ending').hidden=false;document.querySelector('.shell').inert=true;$('restart').focus();return;}state.scene++;state.rootOpen=false;history=[];$('hero').style.left='12%';$('hero').style.top='64%';render();message(scenes[state.scene].intro,scenes[state.scene].body);};
$('hint').onclick=()=>{returnFocus=$('hint');$('explainText').textContent=state.scene===0?'こくようせきは、われた ふちが するどい。ねっこを きっても、まわりみちを しても いいぞ。':state.scene===1?'すなには かたい けいがん。さがんに ねつと あつりょくを かけると かわる。がけの かげも さがしてみよう。':'ちかみちは こくようせきと けいがんの でばん。たにの まわりみちでは べつの はっけんが あるかも。';$('explanation').showModal();};$('closeExplanation').onclick=()=>{$('explanation').close();if(returnFocus)returnFocus.focus();};
$('start').onclick=()=>{$('welcome').hidden=true;document.querySelector('.shell').inert=false;$('stones').querySelector('button').focus();};$('restart').onclick=()=>{reset();$('stones').querySelector('button').focus();};$('lookBack').onclick=()=>{$('ending').hidden=true;document.querySelector('.shell').inert=false;$('undo').focus();};$('sound').onclick=()=>{enabled=!enabled;$('sound').setAttribute('aria-pressed',String(enabled));$('sound').textContent=enabled?'♪ おと あり':'♪ おと なし';if(enabled)sound(true);else if(audio)audio.suspend();};
function silence(){if(audio)audio.suspend();}document.addEventListener('visibilitychange',()=>{if(document.hidden)silence();});addEventListener('pagehide',silence);addEventListener('ishikoro:background',silence);
reset();document.querySelector('.shell').inert=true;$('start').focus();
})();
</script></html>
